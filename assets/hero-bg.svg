<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:0.15"/>
      <stop offset="50%" style="stop-color:#E63946;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0.15"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FF6B35" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#heroGrad)"/>
  <rect width="1200" height="400" fill="url(#dots)"/>
  <!-- Floating chain letters -->
  <g opacity="0.15">
    <text x="100" y="100" font-family="Georgia,serif" font-weight="900" font-size="80" fill="#C1272D">A</text>
    <text x="220" y="140" font-family="Georgia,serif" font-weight="900" font-size="60" fill="#C1272D">B</text>
    <text x="320" y="180" font-family="Georgia,serif" font-weight="900" font-size="40" fill="#C1272D">C</text>
    <text x="380" y="220" font-family="Georgia,serif" font-weight="900" font-size="30" fill="#C1272D">D</text>
    <text x="430" y="260" font-family="Georgia,serif" font-weight="900" font-size="60" fill="#C1272D">E</text>
    <text x="540" y="220" font-family="Georgia,serif" font-weight="900" font-size="80" fill="#C1272D">F</text>
    <text x="700" y="180" font-family="Georgia,serif" font-weight="900" font-size="50" fill="#C1272D">G</text>
    <text x="820" y="140" font-family="Georgia,serif" font-weight="900" font-size="70" fill="#C1272D">H</text>
    <text x="950" y="100" font-family="Georgia,serif" font-weight="900" font-size="90" fill="#C1272D">I</text>
    <text x="1080" y="60" font-family="Georgia,serif" font-weight="900" font-size="60" fill="#C1272D">J</text>
    <text x="100" y="350" font-family="Georgia,serif" font-weight="900" font-size="50" fill="#C1272D">K</text>
    <text x="220" y="370" font-family="Georgia,serif" font-weight="900" font-size="40" fill="#C1272D">L</text>
    <text x="320" y="380" font-family="Georgia,serif" font-weight="900" font-size="60" fill="#C1272D">M</text>
    <text x="450" y="360" font-family="Georgia,serif" font-weight="900" font-size="80" fill="#C1272D">N</text>
    <text x="600" y="370" font-family="Georgia,serif" font-weight="900" font-size="50" fill="#C1272D">O</text>
    <text x="720" y="380" font-family="Georgia,serif" font-weight="900" font-size="70" fill="#C1272D">P</text>
    <text x="850" y="350" font-family="Georgia,serif" font-weight="900" font-size="60" fill="#C1272D">Q</text>
    <text x="950" y="380" font-family="Georgia,serif" font-weight="900" font-size="40" fill="#C1272D">R</text>
    <text x="1050" y="360" font-family="Georgia,serif" font-weight="900" font-size="50" fill="#C1272D">S</text>
  </g>
</svg>
