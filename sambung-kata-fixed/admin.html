<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin • Sambung Kata</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px; }
    .admin-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
    .today-bar { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px; margin-bottom:18px; }
    .tabbar { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; border-bottom:1px solid #222; padding-bottom:8px; }
    .tab { padding:8px 16px; font-size:13px; border-radius:999px; background:#18181b; color:#aaa; border:1px solid #222; cursor:pointer; }
    .tab.active { background:#00bb7f; color:#04130d; border-color:#00bb7f; font-weight:600; }
    .section { background:#0f0f11; border:1px solid #222; border-radius:14px; padding:18px; margin-bottom:16px; }
    .section-title { font-size:13px; font-weight:600; color:#888; margin-bottom:12px; letter-spacing:.5px; }
    .list-item { display:flex; justify-content:space-between; align-items:center; padding:9px 12px; background:#111113; border:1px solid #222; border-radius:8px; margin-bottom:6px; font-size:13px; }
    .form-row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px; }
    .input { background:#111113; border:1px solid #333; color:#eee; padding:8px 12px; border-radius:8px; font-family:monospace; }
    .btn { background:#00bb7f; color:#04130d; border:none; padding:8px 15px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; }
    .btn.ghost { background:#222; color:#ddd; }
    .btn.danger { background:#f43f5e; color:white; }
    .btn.sm { padding:6px 11px; font-size:12px; }
    .muted { color:#666; font-size:12px; }
  </style>

  <!-- Early anti-right-click protection (admin also protected) -->
  <script>
    (function() {
      document.addEventListener('contextmenu', function(e){ e.preventDefault(); e.stopImmediatePropagation(); return false; }, true);
      document.addEventListener('mousedown', function(e){ if(e.button===2){e.preventDefault();return false;} }, true);
      document.addEventListener('selectstart', function(e){ if(e.target.closest('.section') || e.target.closest('main')) e.preventDefault(); }, true);
      document.addEventListener('dragstart', function(e){ e.preventDefault(); }, true);
      document.addEventListener('keydown', function(e){
        const k = (e.key||'').toLowerCase();
        if (k==='f12' || (e.ctrlKey && e.shiftKey && ['i','j','c'].indexOf(k)!==-1) || (e.ctrlKey && (k==='u'||k==='s'))) {
          e.preventDefault(); e.stopImmediatePropagation(); return false;
        }
      }, true);
    })();
  </script>
</head>
<body>
<div class="admin-wrap">

  <div class="admin-header">
    <div>
      <h1 style="margin:0;font-size:21px;font-weight:700;">Admin Panel</h1>
      <div id="whoami" class="muted"></div>
    </div>
    <button id="logoutBtn" class="btn ghost sm">Logout</button>
  </div>

  <div class="today-bar">
    <div class="today-card"><div class="today-num" id="adminTodayVerified">0</div><div class="muted">Verified</div></div>
    <div class="today-card"><div class="today-num" id="adminTodayRejected">0</div><div class="muted">Rejected</div></div>
    <div class="today-card"><div class="today-num" id="adminTodayAdded">0</div><div class="muted">Added</div></div>
  </div>

  <div class="tabbar">
    <button class="tab active" data-tab="add">➕ Tambah</button>
    <button class="tab" data-tab="manage">📋 Kelola</button>
    <button class="tab" data-tab="mystats">📊 My Stats</button>
    <button class="tab" data-tab="contributions" id="contribTab">📥 Contributions</button>
    <button class="tab" data-tab="subscription" id="subTab">💳 Subscription</button>
    <button class="tab" data-tab="announcements" id="annTab">📢 Announcements</button>
    <button class="tab" data-tab="tactical">⚡ Tactical</button>
  </div>

  <!-- ADD -->
  <div id="tab-add" class="section">
    <div class="section-title">TAMBAH KATA</div>
    <div class="form-row">
      <input id="addWord" class="input" placeholder="contoh: cendrawasih" style="width:240px">
      <label style="display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="addVerified"> Verified
      </label>
      <button id="addBtn" class="btn">Tambah</button>
    </div>
    <div style="margin-top:16px">
      <div class="section-title">REJECT KATA</div>
      <div class="form-row">
        <input id="rejWord" class="input" placeholder="kata" style="width:240px">
        <button id="rejBtn" class="btn danger">Request Reject</button>
      </div>
    </div>
  </div>

  <!-- MANAGE -->
  <div id="tab-manage" class="section hidden">
    <div class="section-title">KATA TAMBAHAN</div>
    <input id="searchAdded" class="input" placeholder="Cari..." style="width:200px;margin-bottom:8px">
    <div id="addedList"></div>
    <div style="margin-top:18px">
      <div class="section-title">KATA DI-REJECT</div>
      <input id="searchRej" class="input" placeholder="Cari..." style="width:200px;margin-bottom:8px">
      <div id="rejectedList"></div>
    </div>
  </div>

  <!-- MY STATS -->
  <div id="tab-mystats" class="section hidden">
    <div class="section-title">STATISTIK PRIBADI</div>
    <div id="myStatsContent">Loading...</div>
  </div>

  <!-- CONTRIBUTIONS -->
  <div id="tab-contributions" class="section hidden">
    <div class="section-title">REQUEST DARI USER BASIC</div>
    <div id="contribList">Loading...</div>
  </div>

  <!-- SUBSCRIPTION -->
  <div id="tab-subscription" class="section hidden">
    <div class="section-title">KELOLA LANGGANAN</div>
    <div id="subList">Loading...</div>
  </div>

  <!-- ANNOUNCEMENTS -->
  <div id="tab-announcements" class="section hidden">
    <div class="section-title">ANNOUNCEMENTS (Tampil di Web Utama)</div>
    
    <div class="form-row">
      <input id="annTitle" class="input" placeholder="Judul announcement" style="width:260px">
    </div>
    <div class="form-row">
      <textarea id="annContent" class="input" placeholder="Isi announcement..." style="width:100%; height:80px; resize:vertical"></textarea>
    </div>
    
    <div class="form-row">
      <select id="annColor" class="input" style="width:120px">
        <option value="emerald">Emerald (Hijau)</option>
        <option value="rose">Rose (Merah)</option>
        <option value="amber">Amber (Kuning)</option>
        <option value="zinc">Zinc (Abu)</option>
      </select>
      
      <label style="display:flex;align-items:center;gap:6px;font-size:13px">
        <input type="checkbox" id="annNoExpiry" checked> Tidak ada batas waktu
      </label>
    </div>
    
    <div class="form-row">
      <input id="annValue" class="input" type="number" value="7" style="width:70px">
      <select id="annUnit" class="input" style="width:100px">
        <option value="day">hari</option>
        <option value="month">bulan</option>
        <option value="year">tahun</option>
        <option value="decade">dekade</option>
      </select>
      <button id="annBtn" class="btn">Buat Announcement</button>
    </div>
    
    <div style="margin-top:20px">
      <div class="section-title">DAFTAR ANNOUNCEMENT</div>
      <div id="annList"></div>
    </div>
  </div>

  <!-- TACTICAL -->
  <div id="tab-tactical" class="section hidden">
    <div class="section-title">TACTICAL SUFFIXES</div>
    <div class="form-row">
      <input id="tacWord" class="input" placeholder="oa" style="width:140px">
      <input id="tacTier" class="input" type="number" value="1" style="width:70px">
      <button id="tacBtn" class="btn">Tambah</button>
    </div>
    <div id="tacList" style="margin-top:12px"></div>
  </div>

</div>

<div id="toast" class="toast"></div>
<script src="js/admin.js"></script>
</body>
</html>
