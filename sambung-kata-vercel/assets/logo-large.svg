<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E63946;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C1272D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect x="20" y="20" width="200" height="200" rx="40" fill="url(#bgGrad2)" filter="url(#shadow)"/>
  <!-- Top decorative star -->
  <g fill="#FFD700" opacity="0.9">
    <path d="M 120 50 L 125 65 L 140 70 L 125 75 L 120 90 L 115 75 L 100 70 L 115 65 Z"/>
  </g>
  <!-- Chain links representing "sambung" -->
  <g stroke="url(#ringGrad)" stroke-width="6" fill="none" stroke-linecap="round">
    <circle cx="75" cy="135" r="22"/>
    <circle cx="120" cy="135" r="22"/>
    <circle cx="165" cy="135" r="22"/>
  </g>
  <!-- Letters in chain -->
  <text x="75" y="143" text-anchor="middle" font-family="Georgia,serif" font-weight="900" font-size="22" fill="#C1272D">A</text>
  <text x="120" y="143" text-anchor="middle" font-family="Georgia,serif" font-weight="900" font-size="22" fill="#C1272D">B</text>
  <text x="165" y="143" text-anchor="middle" font-family="Georgia,serif" font-weight="900" font-size="22" fill="#C1272D">C</text>
  <!-- Bottom text -->
  <text x="120" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="20" fill="#FFFFFF">KAMUS</text>
</svg>
