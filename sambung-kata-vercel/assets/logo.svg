<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C1272D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Chain links representing "sambung" -->
  <g stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round">
    <!-- First ring -->
    <circle cx="30" cy="50" r="11" stroke="url(#textGrad)"/>
    <!-- Second ring (overlapping) -->
    <circle cx="50" cy="50" r="11" stroke="url(#textGrad)"/>
    <!-- Third ring -->
    <circle cx="70" cy="50" r="11" stroke="url(#textGrad)"/>
  </g>
  <!-- Letter A -->
  <text x="30" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="14" fill="#C1272D">A</text>
  <!-- Letter B -->
  <text x="50" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="14" fill="#C1272D">B</text>
  <!-- Letter C -->
  <text x="70" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="14" fill="#C1272D">C</text>
  <!-- Sparkle top -->
  <g fill="#FFD700">
    <path d="M 50 10 L 52 18 L 60 20 L 52 22 L 50 30 L 48 22 L 40 20 L 48 18 Z"/>
  </g>
</svg>
